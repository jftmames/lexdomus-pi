name: LLM preview (manual)

on:
  workflow_dispatch:
    inputs:
      clause:
        description: "Cláusula a analizar"
        required: true
        type: string
      jurisdiction:
        description: "Jurisdicción"
        required: true
        type: choice
        options: [ES, EU, US, INT]
      model:
        description: "Modelo OpenAI (por defecto gpt-4o-mini)"
        required: false
        default: "gpt-4o-mini"
        type: string

jobs:
  preview:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'

      - name: Install deps
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip check

      - name: Ensure chunks & indices exist
        run: |
          python scripts/ingest.py
          python scripts/build_index.py

      - name: Run LLM preview (Responses API)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.model }}
          CLAUSE: ${{ inputs.clause }}
          JURISDICTION: ${{ inputs.jurisdiction }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m scripts.llm_preview

      - name: Upload result artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llm-preview-output
          path: llm_preview_output.json
