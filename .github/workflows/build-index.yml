name: Prepare synthetic snapshot (no activation)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-index.yml'
      - 'scripts/ingest.py'
      - 'scripts/build_index.py'
      - 'lex_domus/**'
      - 'tests/**'
      - 'requirements.api.txt'
  pull_request:
    paths: &snapshot_paths
      - '.github/workflows/build-index.yml'
      - 'scripts/ingest.py'
      - 'scripts/build_index.py'
      - 'lex_domus/**'
      - 'tests/**'
      - 'requirements.api.txt'

permissions:
  contents: read

jobs:
  synthetic_snapshot:
    runs-on: ubuntu-24.04
    env:
      USE_LLM: '0'
      OPENAI_API_KEY: ''
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'  # Core lock; Vercel pilot uses Python 3.12.
      - name: Install locked test dependencies
        run: |
          python -m pip install --require-hashes -r requirements.api.txt
          python -m pip check
      - name: Prepare and verify fictional snapshot, including rejection cases
        run: python -m tests.ingestion_smoke --output-dir "$RUNNER_TEMP/synthetic-snapshot"
      - name: Upload verified synthetic evidence only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/synthetic-snapshot
          if-no-files-found: error
          retention-days: 7
