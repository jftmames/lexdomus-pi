name: LLM evaluation (casos frontera)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Modelo OpenAI"
        required: false
        default: "gpt-4o-mini"
        type: string
      cases_path:
        description: "Ruta del JSONL de casos"
        required: false
        default: "tests/casos_frontera.jsonl"
        type: string
      strict:
        description: "Fallar si pass-rate < 60%"
        required: false
        default: "false"
        type: choice
        options: ["false","true"]

jobs:
  eval:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'

      - name: Install deps
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip check

      - name: Ensure chunks & indices exist
        run: |
          python scripts/ingest.py
          python scripts/build_index.py

      - name: Run LLM evaluation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ inputs.model }}
          CASES_PATH: ${{ inputs.cases_path }}
          STRICT: ${{ inputs.strict == 'true' && '1' || '0' }}
        run: |
          python scripts/llm_eval.py

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llm-eval-results
          path: |
            llm_eval_results.csv
            llm_eval_details.json
