name: Post-merge — promote corpus & rebuild indices

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  promote_and_rebuild:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'bot/reforms-')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'

      - name: Install deps
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip check

      - name: Promote proposed -> baseline
        run: |
          python scripts/promote_proposed.py

      - name: Refresh official corpus
        run: |
          python scripts/fetch_corpus.py || true

      - name: Ingest -> chunks
        run: |
          python scripts/ingest.py

      - name: Build indices
        run: |
          python scripts/build_index.py

      - name: Recompute reforms report (should be 0 changes)
        run: |
          python scripts/check_reforms.py
          
      - name: Update families history
        run: |
          python scripts/family_trends.py

      - name: Commit artifacts (rebase-safe)
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="main"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "post-merge: promote baseline + rebuild indices (auto)"
            git fetch origin "$BRANCH"
            git pull --rebase --autostash origin "$BRANCH" || true
            git push origin HEAD:"$BRANCH"
          fi
      - name: Build EEE badge (endpoint JSON)
        env:
          ENABLE_LLM_EVAL: '0'                 # pon '1' si quieres que compute con LLM
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/make_badge.py

      - name: Build rebuild summary (MOCK by default)
        env:
          ENABLE_LLM_EVAL: '0'                  # pon '1' si quieres usar LLM en la mini-eval
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APP_URL: ${{ vars.APP_URL }}          # configura Settings → Actions → Variables → APP_URL
        run: |
          python scripts/rebuild_summary.py

      - name: Comment summary on PR
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-file: rebuild_comment.md
