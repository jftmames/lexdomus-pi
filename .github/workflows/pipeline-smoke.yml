name: Pipeline smoke tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'api/**'
      - 'web/**'
      - 'llm/**'
      - 'requirements.txt'
      - 'requirements.api.txt'
      - 'lex_domus/**'
      - 'verdiktia/**'
      - 'metrics_eee/**'
      - 'tests/**'
      - '.github/workflows/pipeline-smoke.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'api/**'
      - 'web/**'
      - 'llm/**'
      - 'requirements.txt'
      - 'requirements.api.txt'
      - 'lex_domus/**'
      - 'verdiktia/**'
      - 'metrics_eee/**'
      - 'tests/**'
      - '.github/workflows/pipeline-smoke.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install existing frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run offline frontend contract and rendering tests
        run: node --test tests/analyze-contract.test.cjs
      - name: Build frontend
        run: npm run build

  smoke:
    runs-on: ubuntu-latest
    env:
      USE_LLM: '0'
      OPENAI_API_KEY: ''
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements.api.txt

      - name: Run offline contract regression tests
        run: python -m unittest discover -s tests -p 'test*.py' -v

      - name: Ensure chunks & indices exist
        run: |
          python scripts/ingest.py
          python scripts/build_index.py

      - name: Run smoke tests
        env:
          PYTHONPATH: .
        run: |
          python -m tests.smoke
