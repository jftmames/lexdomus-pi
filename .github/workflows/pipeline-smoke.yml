name: Pipeline smoke tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'lex_domus/**'
      - 'verdiktia/**'
      - 'metrics_eee/**'
      - 'tests/**'
      - '.github/workflows/pipeline-smoke.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'lex_domus/**'
      - 'verdiktia/**'
      - 'metrics_eee/**'
      - 'tests/**'
      - '.github/workflows/pipeline-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      USE_LLM: '0'
      OPENAI_API_KEY: ''
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run offline contract regression tests
        run: python -m unittest discover -s tests -p 'test_contracts.py' -v

      - name: Ensure chunks & indices exist
        run: |
          python scripts/ingest.py
          python scripts/build_index.py

      - name: Run smoke tests
        env:
          PYTHONPATH: .
        run: |
          python -m tests.smoke
