name: Pipeline smoke tests

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'web/.nvmrc'
          package-manager-cache: false
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Run offline frontend contract and rendering tests
        run: node --test tests/analyze-contract.test.cjs
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build frontend
        run: npm run build

  smoke:
    runs-on: ubuntu-24.04
    env:
      USE_LLM: '0'
      OPENAI_API_KEY: ''
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.16'  # Core lock; Vercel pilot uses Python 3.12.

      - name: Install deps
        run: |
          python -m pip install --require-hashes -r requirements.api.txt
          python -m pip check

      - name: Verify dependency inventory
        run: python tools/dependency_inventory.py --check

      - name: Run offline contract regression tests
        run: python -m unittest discover -s tests -p 'test*.py' -v

      - name: Verify review-only BOE extraction and diagnostic reproducibility
        run: |
          python -m unittest tools.test_boe_review_extraction tools.test_boe_rankers -v
          python tools/evaluate_boe_review.py --check
          python tools/compare_boe_rankers.py --check

      - name: Check source registry without promoting corpus
        run: python scripts/ingest.py --check

      - name: Exercise candidate ingestion and verified snapshot on synthetic data
        run: python -m tests.ingestion_smoke

      - name: Verify declared retrieval mode and synthetic reference results
        run: python tools/evaluate_retrieval.py --check

      - name: Run smoke tests
        env:
          PYTHONPATH: .
        run: |
          python -m tests.smoke

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build pinned API image
        run: docker build --tag lexdomus-pi:ci .
      - name: Exercise API and pipeline inside the non-root image
        run: |
          docker run --rm --env USE_LLM=0 --env PYTHONPATH=/app \
            --mount "type=bind,source=$GITHUB_WORKSPACE/tests,target=/app/tests,readonly" \
            lexdomus-pi:ci python -m unittest discover -s tests -p 'test*.py' -v
      - name: Build and verify development runtimes
        run: |
          docker build --file .devcontainer/Dockerfile --tag lexdomus-pi:dev-ci .
          docker run --rm lexdomus-pi:dev-ci sh -c 'python --version && node --version && npm --version && git --version'
